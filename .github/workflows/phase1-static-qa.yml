name: Phase 1 website checks
on:
  push:
    branches:
      - planning/phase-1-site-improvements-2026-11
  pull_request:
    paths:
      - 'site/**'
      - 'scripts/check-static-site.mjs'
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify site pages, images and links
        run: node scripts/check-static-site.mjs
