name: Materialise approved website images (development branch only)
on:
  push:
    branches:
      - planning/phase-1-site-improvements-2026-11
    paths:
      - '.github/workflows/phase1-materialise-assets.yml'
      - 'scripts/materialise-phase1-images.mjs'
permissions:
  contents: write
jobs:
  prepare-native-images:
    if: github.ref == 'refs/heads/planning/phase-1-site-improvements-2026-11'
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract native raster assets
        run: node scripts/materialise-phase1-images.mjs
      - name: Commit binaries to development branch only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/images/guides/*.jpg site/images/photos/estate-town.jpg site/images/photos/town-street.jpg site/images/photos/contact-photo.jpg site/images/og-image.png
          if git diff --cached --quiet; then
            echo "No asset changes"
          else
            git commit -m "assets: materialise native JPG/PNG for approved Phase 1 imagery"
            git push origin HEAD:planning/phase-1-site-improvements-2026-11
          fi
