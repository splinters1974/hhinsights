name: Phase 1 local browser smoke tests (no deployment)
on:
  push:
    branches:
      - planning/phase-1-site-improvements-2026-11
    paths:
      - 'scripts/smoke-site.mjs'
      - '.github/workflows/phase1-browser-qa.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'scripts/smoke-site.mjs'
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Smoke test the local website at desktop and mobile sizes
        run: node scripts/smoke-site.mjs
      - name: Save review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-browser-screenshots
          path: phase1-browser-screenshots/
          if-no-files-found: ignore
